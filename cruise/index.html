<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Eclat Passage 크루즈 플래너</title>
<meta name="description" content="5문항으로 설계하는 나만의 크루즈 — 선사·기항지·선상 스케줄까지">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.min.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,500&family=Noto+Serif+KR:wght@600;700&display=swap">
<style>
:root{
  --sea1:#38C4C4; --sea2:#0B8A96; --sea3:#066270; --deep:#04465A; --navy:#13203F;
  --gold1:#FFEEB0; --gold2:#D6A03A; --gold:#E2B656; --amber:#F37021; --amber2:#FF9A3C;
  --bg:#F3FBFB; --card:#FFFFFF; --ink:#13203F; --sub:#5B6B7C; --line:#D6ECEC;
  --teal:#0B8A96; --teal-soft:#E0F5F5; --amber-soft:#FFF0E3;
  --radius:20px; --shadow:0 10px 30px rgba(6,98,112,.12);
  --serif:"Noto Serif KR",serif; --en:"Cormorant Garamond",serif;
  --goldtext:linear-gradient(180deg,var(--gold1),var(--gold2));
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Pretendard,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif}
body{min-height:100vh;min-height:100dvh;display:flex;justify-content:center;background:
  radial-gradient(120% 60% at 50% 0%,#E6FAFA 0%,var(--bg) 60%)}
.app{width:100%;max-width:480px;padding:0 16px 48px;position:relative;overflow:hidden}

/* 위 항로 진행 */
header.top{position:sticky;top:0;z-index:5;padding:14px 0 12px;display:none;background:linear-gradient(180deg,var(--bg) 75%,rgba(243,251,251,0))}
header.top.on{display:block}
.toprow{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:0;background:var(--card);width:40px;height:40px;border-radius:14px;box-shadow:var(--shadow);font-size:18px;color:var(--ink);cursor:pointer}
.stepno{font-weight:800;font-size:13px;color:var(--sea3);letter-spacing:.04em}
.stepno b{font-size:18px;font-weight:900;color:var(--amber);margin-right:2px}
.brand{margin-left:auto;display:flex;align-items:center;gap:6px;font-family:var(--en);font-style:italic;font-size:16px;color:var(--gold2);font-weight:600}
.brand img{width:24px;height:24px}
.route{position:relative;height:30px}
.route .track{position:absolute;left:0;right:0;top:19px;height:6px;border-radius:99px;background:repeating-linear-gradient(90deg,#BFE3E3 0 8px,transparent 8px 14px)}
.route .track i{display:block;height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,var(--sea1),var(--sea3));transition:width .6s cubic-bezier(.4,1.4,.5,1)}
.route .boat{position:absolute;top:-2px;left:0;font-size:22px;transform:translateX(-50%);transition:left .6s cubic-bezier(.4,1.4,.5,1);filter:drop-shadow(0 3px 3px rgba(6,98,112,.25));animation:bob 1.6s ease-in-out infinite}
.route .flag{position:absolute;right:-4px;top:2px;font-size:16px}
@keyframes bob{50%{transform:translateX(-50%) translateY(-3px) rotate(-4deg)}}

.screen{display:none;animation:in .5s cubic-bezier(.2,.8,.2,1) both}
.screen.on{display:block}
.screen.out{animation:out .25s ease both}
.screen.back-in{animation:inb .5s cubic-bezier(.2,.8,.2,1) both}
@keyframes in{from{opacity:0;transform:translateX(40px) scale(.98)}to{opacity:1;transform:none}}
@keyframes inb{from{opacity:0;transform:translateX(-40px)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateX(-40px)}}

/* 첫 화면 */
.hero{background:linear-gradient(170deg,#0B8A96,#04465A 70%);position:relative;margin:0 -16px;height:min(78vh,640px);min-height:520px;border-radius:0 0 36px 36px;overflow:hidden;color:#fff;display:flex;flex-direction:column;justify-content:flex-end;padding:0 24px 34px;box-shadow:0 18px 40px rgba(4,70,90,.3)}
.hero .slide{position:absolute;inset:0;background-size:cover;background-position:center;opacity:0;transform:scale(1.08);animation:slide 24s infinite}
.hero .slide:first-child{opacity:1;transform:none}.hero .slide:nth-child(2){animation-delay:4s}.hero .slide:nth-child(3){animation-delay:8s}.hero .slide:nth-child(4){animation-delay:12s}.hero .slide:nth-child(5){animation-delay:16s}.hero .slide:nth-child(6){animation-delay:20s}
@keyframes slide{0%{opacity:0;transform:scale(1.08)}4%,16%{opacity:1}21%,100%{opacity:0;transform:scale(1)}}
.hero::before{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(4,70,90,.15) 0%,rgba(6,98,112,.35) 40%,rgba(4,50,70,.92) 100%);z-index:1}
.hero>*{position:relative;z-index:2}
.hero .mark{position:absolute;top:26px;left:50%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
.hero .mark img{width:76px;height:76px;animation:spin 30s linear infinite;filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
@keyframes spin{to{transform:rotate(360deg)}}
.hero .mark span{font-family:var(--serif);font-weight:700;letter-spacing:.32em;font-size:12px;background:var(--goldtext);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero .pill{align-self:flex-start;background:rgba(255,255,255,.18);backdrop-filter:blur(6px);border:1px solid rgba(255,238,176,.6);border-radius:99px;padding:6px 12px;font-size:12.5px;font-weight:700;margin-bottom:14px}
.hero h1{font-family:var(--serif);font-size:30px;line-height:1.38;margin:0 0 12px;letter-spacing:-.01em;text-shadow:0 2px 12px rgba(0,0,0,.3)}
.hero h1 em{font-style:normal;background:var(--goldtext);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;font-size:14.5px;line-height:1.65;color:rgba(255,255,255,.9)}
.intro-body{padding:22px 4px 0;text-align:center}
.meta{display:flex;justify-content:center;gap:8px;margin-bottom:18px;flex-wrap:wrap}
.meta span{background:var(--card);border:1px solid var(--line);padding:8px 13px;border-radius:99px;font-size:13px;color:var(--sea3);font-weight:700}
.sig{font-size:13px;color:var(--sub);margin:16px 0 0}
.sig b{color:var(--sea3)}
.btn{display:block;width:100%;border:0;border-radius:18px;padding:19px;font-size:17px;font-weight:800;font-family:inherit;cursor:pointer;background:var(--navy);color:#fff;box-shadow:0 10px 24px rgba(19,32,63,.25);transition:transform .15s}
.btn:active{transform:scale(.97)}
.btn.amber{background:linear-gradient(135deg,var(--amber2),var(--amber));box-shadow:0 12px 26px rgba(243,112,33,.38);position:relative;overflow:hidden}
.btn.amber::after{content:"";position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 2.8s ease-in-out infinite}
@keyframes shine{60%,100%{left:130%}}
.btn:disabled{background:#C5D4D6;box-shadow:none;cursor:not-allowed}
.btn:disabled::after{display:none}

/* 문항 */
.q{padding-top:8px}
.tag{display:inline-block;background:linear-gradient(135deg,var(--gold1),var(--gold));color:var(--navy);font-weight:800;font-size:12.5px;border-radius:99px;padding:6px 12px;margin-bottom:10px;box-shadow:0 4px 12px rgba(214,160,58,.3)}
.q h2{font-family:var(--serif);font-size:24px;line-height:1.42;margin:0 0 6px}
.q .hint{color:var(--sub);font-size:14px;margin:0 0 20px}
.opts{display:grid;gap:12px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;border:2px solid transparent;background:var(--card);border-radius:var(--radius);padding:17px 16px;box-shadow:var(--shadow);cursor:pointer;font-family:inherit;color:var(--ink);transition:transform .15s,border-color .15s}
.opt:active{transform:scale(.97)}
.opt.sel{border-color:var(--gold);background:linear-gradient(135deg,#FFFDF6,#FFF6E0)}
.opt .ico{flex:none;width:50px;height:50px;border-radius:16px;background:linear-gradient(135deg,#E3F8F8,#C9EFEF);display:grid;place-items:center;font-size:25px}
.opt.sel .ico{background:linear-gradient(135deg,var(--gold1),var(--gold))}
.opt b{display:block;font-size:16.5px;margin-bottom:3px}
.opt small{display:block;color:var(--sub);font-size:13.5px;line-height:1.45}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.popt{position:relative;border:3px solid transparent;border-radius:20px;overflow:hidden;padding:0;background:#cde;cursor:pointer;aspect-ratio:4/5;font-family:inherit;box-shadow:var(--shadow);transition:transform .2s,border-color .15s}
.popt:active{transform:scale(.97)}
.popt img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transition:transform .6s}
.popt:hover img{transform:scale(1.06)}
.popt span{position:absolute;left:0;right:0;bottom:0;padding:34px 12px 12px;background:linear-gradient(180deg,transparent,rgba(4,40,60,.88));color:#fff;text-align:left}
.popt b{display:block;font-size:17px}
.popt small{display:block;font-size:12px;opacity:.92;line-height:1.4;margin-top:2px}
.popt.sel{border-color:var(--gold)}
.popt.sel::after{content:"✓";position:absolute;top:8px;right:8px;width:30px;height:30px;border-radius:50%;background:var(--goldtext);color:var(--navy);display:grid;place-items:center;font-weight:900}
.popt.wide{grid-column:1/-1;aspect-ratio:16/8}
.months{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-bottom:12px}
.mon{border:2px solid var(--line);background:var(--card);border-radius:16px;padding:12px 4px 10px;font-family:inherit;cursor:pointer;color:var(--ink);text-align:center;transition:transform .12s}
.mon:active{transform:scale(.95)}
.mon b{display:block;font-size:17px}
.mon small{display:block;font-size:11px;color:var(--sub);margin-top:2px}
.mon.off{opacity:.45}
.mon.off small{color:#C2412D}
.mon.sel{border-color:var(--sea3);background:linear-gradient(135deg,var(--sea1),var(--sea3));color:#fff;opacity:1;box-shadow:0 6px 14px rgba(6,98,112,.3)}
.mon.sel small{color:rgba(255,255,255,.85)}
.season{font-size:13px;color:var(--sea3);background:var(--teal-soft);border-radius:14px;padding:11px 13px;margin-bottom:14px;line-height:1.5;font-weight:600}
.unk{display:block;width:100%;border:2px dashed #BFDCDC;background:none;border-radius:16px;padding:12px;font-family:inherit;font-size:14px;color:var(--sub);cursor:pointer;margin-bottom:16px}
.unk.sel{border-style:solid;border-color:var(--sea3);color:var(--sea3);font-weight:800}

.field{background:var(--card);border-radius:var(--radius);padding:18px 16px;box-shadow:var(--shadow);margin-bottom:14px}
.field label{display:block;font-weight:800;font-size:15px;margin-bottom:4px}
.field .lh{display:block;color:var(--sub);font-size:13px;margin-bottom:12px}
.field input{width:100%;font-size:22px;font-family:inherit;font-weight:700;letter-spacing:.12em;padding:14px;border:2px solid var(--line);border-radius:14px;color:var(--ink);background:#F7FCFC;outline:none;text-align:center}
.field input:focus{border-color:var(--sea2)}
.err{color:#C2412D;font-size:13px;margin-top:8px;min-height:18px}
.pal{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.sw{border:0;background:none;padding:0;cursor:pointer;font-family:inherit;color:var(--ink);font-size:12px;font-weight:700;line-height:1.3}
.sw i{display:block;aspect-ratio:1;border-radius:50%;margin:0 auto 6px;border:3px solid #fff;box-shadow:0 0 0 1px #CFE3E3,0 6px 12px rgba(0,0,0,.08);transition:transform .15s,box-shadow .15s;position:relative}
.sw.sel i{transform:scale(1.08);box-shadow:0 0 0 3px var(--gold),0 8px 16px rgba(214,160,58,.35)}
.sw.sel i::after{content:"✓";position:absolute;inset:0;display:grid;place-items:center;color:#fff;font-size:22px;font-weight:900;text-shadow:0 1px 3px rgba(0,0,0,.5)}
.mbti-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.mbti-col{display:grid;gap:6px}
.mb-b{border:2px solid var(--line);background:#F7FCFC;border-radius:14px;padding:10px 0;font-family:inherit;font-size:17px;font-weight:800;color:var(--ink);cursor:pointer}
.mb-b small{display:block;font-size:10.5px;font-weight:600;color:var(--sub);margin-top:2px}
.mb-b.sel{border-color:var(--sea3);background:var(--sea3);color:#fff}
.mb-b.sel small{color:rgba(255,255,255,.8)}
.mb-skip{display:block;margin:10px auto 0;background:none;border:0;font-family:inherit;font-size:13px;color:var(--sub);text-decoration:underline;cursor:pointer}
.mb-skip.sel{color:var(--sea3);font-weight:800;text-decoration:none}

/* 항로 설계 중 */
.loading{text-align:center;padding-top:20vh}
.sea{position:relative;height:120px;margin:0 -16px 26px;overflow:hidden}
.sea .ship{position:absolute;bottom:38px;left:-20%;font-size:56px;animation:sail 2.2s cubic-bezier(.4,0,.6,1) forwards,bob2 1s ease-in-out infinite}
@keyframes sail{to{left:72%}}
@keyframes bob2{50%{transform:translateY(-6px) rotate(-3deg)}}
.sea .w{position:absolute;left:-50%;width:200%;height:60px;bottom:0;background:radial-gradient(40px 14px at 40px 0,transparent 98%,var(--sea1) 100%) 0 0/80px 60px repeat-x;opacity:.8;animation:wave 2.4s linear infinite}
.sea .w2{bottom:-12px;opacity:1;background:radial-gradient(40px 14px at 40px 0,transparent 98%,var(--sea3) 100%) 0 0/80px 60px repeat-x;animation-duration:3.2s;animation-direction:reverse}
@keyframes wave{to{transform:translateX(80px)}}
.loading h3{font-family:var(--serif);font-size:21px;margin:0 0 8px}
.loading p{color:var(--sub);font-size:14px;margin:0;min-height:20px}

/* 결과 — 탑승권 */
.res{padding-top:26px}
.res .kicker{font-family:var(--en);font-size:18px;color:var(--gold2);text-align:center;font-style:italic;font-weight:600}
.pass{position:relative;margin:12px 0 18px;border-radius:24px;overflow:hidden;box-shadow:0 18px 40px rgba(4,70,90,.25);background:var(--card)}
.pass .top{position:relative;color:#fff;padding:24px 20px 22px;text-align:center}
.pass .top::before{content:"";position:absolute;inset:10px;border:1px solid rgba(255,238,176,.55);border-radius:16px;pointer-events:none}
.pass .bp{display:flex;justify-content:space-between;font-family:var(--en);font-size:13px;letter-spacing:.24em;opacity:.95;margin-bottom:10px}
.pass .en{font-family:var(--en);font-size:15px;letter-spacing:.2em;opacity:.95}
.pass h2{font-family:var(--serif);font-size:31px;margin:4px 0}
.pass .sym{font-size:14px;opacity:.92}
.pass .one{margin:16px 6px 0;background:rgba(255,255,255,.18);border-radius:14px;padding:13px;font-size:15.5px;font-weight:700;line-height:1.5}
.pass.light .top{color:var(--ink)}
.pass.light .one{background:rgba(19,32,63,.07)}
.pass .perf{position:relative;height:0;border-top:2px dashed #CFE3E3;margin:0 18px}
.pass .perf::before,.pass .perf::after{content:"";position:absolute;top:-13px;width:26px;height:26px;border-radius:50%;background:var(--bg)}
.pass .perf::before{left:-31px}.pass .perf::after{right:-31px}
.pass .stub{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:16px 18px 18px}
.pass .stub div{font-size:10.5px;color:var(--sub);font-weight:700;letter-spacing:.08em}
.pass .stub b{display:block;font-size:14px;color:var(--ink);letter-spacing:0;margin-top:3px}
.mbline{margin:12px 0 0;font-size:14px;line-height:1.5;opacity:.95}
.mbline b{font-size:15px;letter-spacing:.04em}
.locked{position:relative;border-radius:var(--radius);overflow:hidden;background:var(--card);box-shadow:var(--shadow);margin-bottom:18px}
.preview{padding:20px 18px;filter:blur(5px);user-select:none;pointer-events:none}
.preview h4{margin:0 0 8px;font-size:15px;color:var(--sea3)}
.preview .ln{height:10px;border-radius:5px;background:#DCEDED;margin:7px 0}
.preview .sec{margin-bottom:18px}
.preview .tbl{display:grid;grid-template-columns:60px 1fr;gap:6px;margin-top:8px}
.preview .tbl span{height:16px;border-radius:4px;background:var(--teal-soft)}
.preview .tbl span:nth-child(odd){background:var(--amber-soft)}
.lockover{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(180deg,rgba(243,251,251,.15),rgba(243,251,251,.9));text-align:center;padding:20px}
.lockover .lk{width:58px;height:58px;border-radius:50%;background:linear-gradient(135deg,var(--sea2),var(--deep));color:var(--gold1);display:grid;place-items:center;font-size:24px;margin-bottom:12px;border:2px solid var(--gold)}
.lockover b{font-size:17px;margin-bottom:6px}
.lockover span{font-size:13.5px;color:var(--sub);line-height:1.5}
.toc{list-style:none;padding:0;margin:0 0 18px;display:grid;gap:8px}
.toc li{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:center}
.toc li em{font-style:normal;flex:none;width:26px;height:26px;border-radius:50%;background:linear-gradient(135deg,var(--sea2),var(--deep));color:var(--gold1);display:grid;place-items:center;font-weight:800;font-size:12px}
.toc li::after{content:"🔒";margin-left:auto;font-size:12px}
.note{font-size:12.5px;color:var(--sub);text-align:center;margin:12px 0 0;line-height:1.5}
.retry{display:block;margin:16px auto 0;background:none;border:0;color:var(--sub);text-decoration:underline;font-family:inherit;font-size:13px;cursor:pointer}
.credit{font-size:10.5px;color:var(--sub);text-align:center;margin:22px 0 0;line-height:1.5}
.credit summary{cursor:pointer}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:30;overflow:hidden}
.confetti i{position:absolute;top:-20px;width:9px;height:14px;border-radius:2px;animation:fall 2.6s cubic-bezier(.25,.6,.4,1) forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg);opacity:.2}}

.modal{position:fixed;inset:0;background:rgba(4,30,45,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex;animation:fade .2s both}
@keyframes fade{from{opacity:0}}
.sheet{width:100%;max-width:480px;background:var(--card);border-radius:26px 26px 0 0;padding:26px 20px calc(24px + env(safe-area-inset-bottom));animation:up .3s cubic-bezier(.2,.8,.2,1) both}
@keyframes up{from{transform:translateY(40px)}}
.sheet .ok{width:56px;height:56px;border-radius:50%;background:linear-gradient(135deg,var(--sea1),var(--sea3));color:#fff;display:grid;place-items:center;font-size:26px;margin:0 auto 14px}
.sheet h3{text-align:center;font-size:19px;margin:0 0 6px;line-height:1.4}
.sheet p{text-align:center;color:var(--sub);font-size:14px;margin:0 0 16px;line-height:1.5}
.code{background:#F3FBFB;border:1px dashed #BFDCDC;border-radius:12px;padding:12px;font-size:13px;line-height:1.5;word-break:keep-all;margin-bottom:14px;user-select:all}
.row2{display:grid;grid-template-columns:1fr 1.6fr;gap:10px}
.btn.ghost{background:#F3FBFB;color:var(--ink);box-shadow:none;border:1px solid var(--line);font-size:15px}
</style>
</head>
<body>
<div class="app">
  <header class="top" id="top">
    <div class="toprow">
      <button class="back" id="backBtn" aria-label="이전">←</button>
      <span class="stepno" id="stepNo">STEP 1 / 8</span>
      <span class="brand"><img src="img/compass.png" alt="">Eclat Passage</span>
    </div>
    <div class="route"><div class="track"><i id="barFill"></i></div><span class="boat" id="boat">🛳️</span><span class="flag">🏝️</span></div>
  </header>
  <main id="stage"></main>
</div>

<div class="modal" id="modal">
  <div class="sheet">
    <div class="ok">✓</div>
    <h3>진단코드가 복사되었습니다!</h3>
    <p>열리는 채팅창에 <b>붙여넣기</b>만 해주세요.<br>스칼렛이 나만의 크루즈 설계표를 보내드려요.</p>
    <div class="code" id="codeBox"></div>
    <div class="row2">
      <button class="btn ghost" id="copyAgain">다시 복사</button>
      <button class="btn amber" id="goChat">채팅창 열기 <span id="cd"></span></button>
    </div>
  </div>
</div>

<script>
/* ================= 설정 ================= */
const CHAT_URL = "https://pf.kakao.com/_yrixbX/chat";   // 카카오채널 @크루즈마스터 채팅
const CODE_TAG = "[크루즈진단]";

/* ================= 휴먼컬러 엔진 (만세력 일간) ================= */
function dayPillar(y,m,d){
  const days = Math.round((Date.UTC(y,m-1,d) - Date.UTC(1900,0,1)) / 86400000);
  const idx = ((days + 10) % 60 + 60) % 60;   // 1900-01-01 = 甲戌
  return { stem: idx % 10, branch: idx % 12 };
}
function humanColorKey(y,m,d){
  const s = dayPillar(y,m,d).stem;
  const warm = m >= 3 && m <= 8;
  return ["GAP","EUL","BYEONG","JEONG", warm?"MU_A":"MU_B", warm?"GI_A":"GI_B","GYEONG","SIN","IM","GYE"][s];
}

function show(html, dir){
  const old = stage.querySelector(".screen.on");
  const el = document.createElement("section");
  el.className = "screen";
  el.innerHTML = html;
  const mount = () => { stage.innerHTML = ""; stage.appendChild(el); el.classList.add("on"); if(dir==="back") el.classList.add("back-in"); window.scrollTo(0,0); };
  if(old){ old.classList.add("out"); setTimeout(mount, 200); } else mount();
  return el;
}
function setBar(i){
  topEl.classList.toggle("on", i >= 0 && i < STEPS.length);
  document.getElementById("stepNo").innerHTML = `<b>${i+1}</b>/ ${STEPS.length} 항로`;
  const pct = (i+1)/STEPS.length*100;
  document.getElementById("barFill").style.width = pct + "%";
  document.getElementById("boat").style.left = Math.min(pct, 92) + "%";
}

function go(i, dir){
  cur = i; setBar(i);
  const s = STEPS[i];
  if(s.final) return finalStep(dir);
  if(s.months) return monthStep(dir);
  const head = `${tagHtml(s)}<h2>${s.title.replace("\n","<br>")}</h2><p class="hint">${s.hint}</p>`;
  const body = s.photo
    ? `<div class="pgrid">${s.opts.map(o=>`<button class="popt opt${o.wide?" wide":""}${ans[s.key]===o.code?" sel":""}" data-c="${o.code}"><img src="${o.img}" alt="${o.label}"><span><b>${o.label}</b><small>${o.desc}</small></span></button>`).join("")}</div>`
    : `<div class="opts">${s.opts.map(o=>`
      <button class="opt${ans[s.key]===o.code?" sel":""}" data-c="${o.code}">
        <span class="ico">${o.ico}</span><span><b>${o.label}</b><small>${o.desc}</small></span>
      </button>`).join("")}</div>`;
  const el = show(`<div class="q">${head}${body}</div>`, dir);
  el.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    el.querySelectorAll(".opt").forEach(x=>x.classList.remove("sel"));
    b.classList.add("sel");
    ans[s.key] = b.dataset.c;
    setTimeout(() => go(i+1), 260);
  });
}

function nextMonths(){
  const out = [], now = new Date();
  for(let k = 1; k <= 12; k++){
    const d = new Date(now.getFullYear(), now.getMonth() + k, 1);
    out.push({y:d.getFullYear(), m:d.getMonth()+1, code:`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}`});
  }
  return out;
}
function monthStep(dir){
  const s = STEPS[cur], sea = SEASON[ans["해역"]] || {m:null, txt:""};
  const sel = new Set((ans["출발"]||"").split(",").filter(x => x && x !== "미정"));
  let yPrev = null;
  const el = show(`<div class="q">
    ${tagHtml(s)}<h2>${s.title.replace("\n","<br>")}</h2><p class="hint">${s.hint}</p>
    ${sea.txt ? `<div class="season">⚓ ${sea.txt}</div>` : ""}
    <div class="months">${nextMonths().map(o => {
      const off = sea.m && !sea.m.includes(o.m);
      const yl = o.y !== yPrev ? `${o.y}년` : ""; yPrev = o.y;
      return `<button class="mon${off?" off":""}${sel.has(o.code)?" sel":""}" data-c="${o.code}"><b>${o.m}월</b><small>${off?(yl?yl+" · 운항 적음":"운항 적음"):(yl||"&nbsp;")}</small></button>`;
    }).join("")}</div>
    <button class="unk${ans["출발"]==="미정"?" sel":""}" id="unk">아직 날짜를 몰라요</button>
    <button class="btn amber" id="next" disabled>다음</button>
  </div>`, dir);
  const nx = el.querySelector("#next"), unk = el.querySelector("#unk");
  const sync = () => {
    el.querySelectorAll(".mon").forEach(b => b.classList.toggle("sel", sel.has(b.dataset.c)));
    const v = sel.size ? [...sel].sort().join(",") : (unk.classList.contains("sel") ? "미정" : "");
    ans["출발"] = v; nx.disabled = !v;
    nx.textContent = sel.size ? `다음 (${sel.size}개 달 선택)` : "다음";
  };
  el.querySelectorAll(".mon").forEach(b => b.onclick = () => { sel.has(b.dataset.c) ? sel.delete(b.dataset.c) : sel.add(b.dataset.c); unk.classList.remove("sel"); sync(); });
  unk.onclick = () => { sel.clear(); unk.classList.toggle("sel"); sync(); };
  nx.onclick = () => go(cur + 1);
  sync();
}

function validDate(v){
  if(!/^\d{8}$/.test(v)) return null;
  const y=+v.slice(0,4), m=+v.slice(4,6), d=+v.slice(6,8);
  const dt = new Date(y, m-1, d);
  if(dt.getFullYear()!==y || dt.getMonth()!==m-1 || dt.getDate()!==d) return null;
  if(y < 1920 || dt > new Date()) return null;
  return {y,m,d};
}

    ${tagHtml(s)}<h2>${s.title.replace("\n","<br>")}</h2><p class="hint">${s.hint}</p>
    <div class="field">
      <label for="bd">대표 여행자 생년월일 (양력 8자리)</label><span class="lh">예) 1962년 5월 12일 → 19620512</span>
      <input id="bd" inputmode="numeric" maxlength="8" placeholder="YYYYMMDD" value="${ans["생년월일"]||""}">
      <div class="err" id="bdErr"></div>
    </div>
    <div class="field"><label>지금 가장 끌리는 바다·휴양 컬러</label><span class="lh">떠나고 싶은 바다를 떠올리며 하나만</span>
      <div class="pal">${PALETTE.map(p=>`<button class="sw" data-c="${p.code}"><i style="background:${p.hex}"></i>${p.code}</button>`).join("")}</div></div>
    <div class="field"><label>MBTI (선택)</label><span class="lh">알면 골라 주세요 — 휴먼컬러와 함께 더 정밀하게 맞춰 드려요</span>
      <div class="mbti-grid">${[0,1,2,3].map(i=>`<div class="mbti-col">${[0,1].map(j=>{const [l,k]=MBTI_PAIRS[i*2+j];return `<button class="mb-b" data-i="${i}" data-l="${l}">${l}<small>${k}</small></button>`}).join("")}</div>`).join("")}</div>
      <button class="mb-skip" id="mbSkip">MBTI를 몰라요 / 건너뛰기</button></div>
    <button class="btn amber" id="submit" disabled>나만의 크루즈 설계 보기</button>
  </div>`, dir);
  const bd = el.querySelector("#bd"), err = el.querySelector("#bdErr"), sub = el.querySelector("#submit");
  const sync = () => {
    el.querySelectorAll(".sw").forEach(b=>b.classList.toggle("sel", ans["컬러"]===b.dataset.c));
    const ok = validDate(bd.value);
    err.textContent = bd.value.length===8 && !ok ? "날짜를 다시 확인해 주세요 (예: 19620512)" : "";
    const mb = ans["MBTI_SEL"] || [];
    el.querySelectorAll(".mb-b").forEach(b=>b.classList.toggle("sel", mb[+b.dataset.i]===b.dataset.l));
    el.querySelector("#mbSkip").classList.toggle("sel", ans["MBTI_SKIP"]===true);
    ans["MBTI"] = mb.filter(Boolean).length===4 ? mb.join("") : "";
    sub.disabled = !(ok && ans["컬러"] && (ans["MBTI"] || ans["MBTI_SKIP"]));
  };
  bd.oninput = () => { bd.value = bd.value.replace(/\D/g,""); ans["생년월일"] = bd.value; sync(); };
  el.querySelectorAll(".sw").forEach(b => b.onclick = () => { ans["컬러"] = b.dataset.c; sync(); });
  el.querySelectorAll(".mb-b").forEach(b => b.onclick = () => { const mb = ans["MBTI_SEL"] || []; mb[+b.dataset.i] = b.dataset.l; ans["MBTI_SEL"] = mb; ans["MBTI_SKIP"] = false; sync(); });
  el.querySelector("#mbSkip").onclick = () => { ans["MBTI_SEL"] = []; ans["MBTI_SKIP"] = true; sync(); };

  sub.onclick = loading;
  sync();
}

function loading(){
  topEl.classList.remove("on");
  show(`<div class="loading"><div class="sea"><div class="ship">🛳️</div><div class="w"></div><div class="w w2"></div></div><h3>진단서를 설계 중입니다...</h3><p id="lmsg">여행자 휴먼컬러를 계산하고 있어요</p></div>`);
  const msgs = ["동행자와의 여행 호흡을 맞추고 있어요","선사와 선박을 매칭하고 있어요","선상 24시간 스케줄을 짜고 있어요"];
  msgs.forEach((m,i)=>setTimeout(()=>{ const p=document.getElementById("lmsg"); if(p) p.textContent=m; }, 500*(i+1)));
  setTimeout(result, 2000);
}

function hcTag(){
  const {y,m,d} = validDate(ans["생년월일"]); const ck = humanColorKey(y,m,d);
  return ` / 휴먼컬러:${HC[ck].name}(${ans["MBTI"] || HC_MBTI[ck] + "결"})`;
}
function buildCode(){
  return `${CODE_TAG} 동행:${ans["동행"]} / 해역:${ans["해역"]} / 기간:${ans["기간"]} / 출발:${ans["출발"]} / 객실:${ans["객실"]} / 기항지:${ans["기항지"]} / 선상:${ans["선상"]} / 생년월일:${ans["생년월일"]} / 컬러:${ans["컬러"]}${ans["MBTI"]?` / MBTI:${ans["MBTI"]}`:""}${hcTag()}`;
}

function result(){
  const {y,m,d} = validDate(ans["생년월일"]);
  const ck = humanColorKey(y,m,d), c = HC[ck];
  const mt = ans["MBTI"] || HC_MBTI[ck];
  const mbLine = ans["MBTI"]
    ? `<p class="mbline">내 MBTI <b>${mt}</b> × ${c.name} = <b>${MBTI_NICK[mt]}</b>형 여행자</p>`
    : `<p class="mbline">MBTI로 치면 <b>${mt}</b> 결 · ${MBTI_NICK[mt]}</p>`;
  const sections = ["여행자 휴먼컬러 스타일 & 동행자 체력·호흡 궁합","맞춤 선사·선박 & 출발 시기·객실","추천 기항지 & 피로도 0% 반나절 코스","스칼렛의 선상 24시간 황금 스케줄표"];
  const fake = (n) => Array.from({length:n},(_,i)=>`<div class="ln" style="width:${92-(i*13)%40}%"></div>`).join("");
  const el = show(`<div class="res">
    <div class="kicker">Your Traveler Color</div>
    <div class="pass${c.light?" light":""}">
      <div class="top" style="background:linear-gradient(150deg,${c.hex},${shade(c.hex,-40)})">
        <div class="bp"><span>BOARDING PASS</span><span>ÉCLAT</span></div>
        <div class="en">${c.en.toUpperCase()}</div><h2>${c.name}</h2><div class="sym">${c.sym}</div>
        <p class="one">${c.one}</p>${mbLine}
      </div>
      <div class="perf"></div>
      <div class="stub">
        <div>DESTINATION<b>${({일본:"일본",중국:"중국",대만:"대만",동남아:"동남아",유럽:"유럽",미국:"미국"})[ans["해역"]]||"-"}</b></div>
        <div>DEPART<b>${!ans["출발"]||ans["출발"]==="미정"?"미정":ans["출발"].split(",").map(x=>+x.slice(5)+"월").slice(0,3).join("·")}</b></div>
        <div>CABIN<b>${ans["객실"]||"-"}</b></div>
      </div>
    </div>
    <div class="locked">
      <div class="preview">${sections.map((t,i)=>`<div class="sec"><h4>${i+1}. ${t}</h4>${fake(2)}${i===3?`<div class="tbl">${"<span></span>".repeat(10)}</div>`:fake(1)}</div>`).join("")}</div>
      <div class="lockover"><div class="lk">🔒</div><b>크루즈 설계표 4개 섹션이 잠겨 있어요</b><span>추천 선박과 객실, 출발 시기, 기항지 반나절 코스,<br>선상 24시간 스케줄표까지 이미지로 받아보세요.</span></div>
    </div>
    <ul class="toc">${sections.map((t,i)=>`<li><em>${i+1}</em>${t}</li>`).join("")}</ul>
    <button class="btn amber" id="getFull">내 상세 진단서 전체 받기</button>
    <p class="note">버튼을 누르면 진단코드가 복사되고 스칼렛 카카오채널이 열려요.<br>붙여넣기만 하면 크루즈 설계표 이미지를 보내드립니다.</p>
    <button class="retry" id="retry">처음부터 다시 하기</button>
    ${CREDIT}
  </div>`);
  el.querySelector("#getFull").onclick = getFull;
  el.querySelector("#retry").onclick = () => { for(const k in ans) delete ans[k]; intro(); };
  setTimeout(confetti, 350);
}

function confetti(){
  const box = document.createElement("div"); box.className = "confetti";
  const cols = ["#38C4C4","#FFEEB0","#D6A03A","#F37021","#0B8A96","#FFFFFF"];
  for(let k = 0; k < 46; k++){
    const i = document.createElement("i");
    i.style.left = Math.random()*100 + "%"; i.style.background = cols[k % cols.length];
    i.style.animationDelay = (Math.random()*.6) + "s"; i.style.transform = `rotate(${Math.random()*180}deg)`;
    box.appendChild(i);
  }
  document.body.appendChild(box); setTimeout(() => box.remove(), 3600);
}

function copyText(t){
  let ok = false;
  try{
    const ta = document.createElement("textarea");
    ta.value = t; ta.setAttribute("readonly",""); ta.style.cssText = "position:fixed;top:0;left:0;opacity:0";
    document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0, t.length);
    ok = document.execCommand("copy"); ta.remove();
  }catch(e){}
  if(navigator.clipboard && window.isSecureContext) navigator.clipboard.writeText(t).catch(()=>{});
  return ok;
}
let timer;
function getFull(){
  const code = buildCode();
  copyText(code);
  document.getElementById("codeBox").textContent = code;
  document.getElementById("modal").classList.add("on");
  let n = 3; const cd = document.getElementById("cd");
  cd.textContent = `(${n})`;
  clearInterval(timer);
  timer = setInterval(() => { n--; cd.textContent = n>0?`(${n})`:""; if(n<=0){ clearInterval(timer); location.href = CHAT_URL; } }, 1000);
}
document.getElementById("goChat").onclick = () => { clearInterval(timer); location.href = CHAT_URL; };
document.getElementById("copyAgain").onclick = (e) => { clearInterval(timer); document.getElementById("cd").textContent=""; copyText(buildCode()); e.target.textContent = "복사 완료 ✓"; };
document.getElementById("modal").onclick = (e) => { if(e.target.id==="modal"){ clearInterval(timer); e.currentTarget.classList.remove("on"); } };
document.getElementById("backBtn").onclick = () => { if(cur<=0) intro(); else go(cur-1, "back"); };

function shade(hex, amt){
  const n = parseInt(hex.slice(1),16);
  const f = v => Math.max(0, Math.min(255, v + amt));
  return "#" + [f(n>>16), f((n>>8)&255), f(n&255)].map(v=>v.toString(16).padStart(2,"0")).join("");
}

intro();
</script>
</body>
</html>
